name: Otty accent migration

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/otty-accent-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply Otty accent palette
        run: |
          python scripts/migrate-otty-accents.py
          python scripts/migrate-otty-worker.py
          python scripts/migrate-otty-tests.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Verify COSS source contracts
        run: npm run coss:verify

      - name: Build
        run: npm run build

      - name: Commit changes to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/contracts.ts shared/preferences.ts src/lib/preferences.ts src/lib/storage.ts src/features/settings/settings-page.tsx src/styles.css worker/preferences.ts tests/sqlite-regressions.test.mjs tests/storage.test.mjs
          git diff --cached --check
          git commit -m "feat: replace accents with Otty palette"
          git push origin HEAD:dev
